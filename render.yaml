services:
  - type: web
    name: django-web
    env: python
    buildCommand: pip install -r requirements.txt
startCommand: gunicorn ai_blog.wsgi:application --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: new-env
          property: connectionString
